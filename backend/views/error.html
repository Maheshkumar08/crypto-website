<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}} — cryptolearner.us</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafafa; color: #111827;
         font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .code { font-size: 64px; font-weight: 700; color: #2563eb; margin: 0; }
  h1 { font-size: 24px; margin: 16px 0 8px; }
  p { color: #6b7280; max-width: 24rem; margin: 0 auto; line-height: 1.5; }
  a { display: inline-block; margin-top: 32px; padding: 12px 24px; border-radius: 999px; background: #111827; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p class="code">{{status}}</p>
  <h1>{{title}}</h1>
  <p>{{message}}</p>
  <a href="/">Back to home</a>
</main>
</body>
</html>
